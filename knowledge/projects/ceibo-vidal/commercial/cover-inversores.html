<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ceibo Vidal — Portada · Carpeta inversores</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #21201E; }
    .cover {
      position: relative;
      width: 794px;
      height: 1123px;
      background: #21201E;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-bottom: 7%;
      overflow: hidden;
    }
    .cover img {
      display: block;
      height: 410px;
      width: auto;
      filter: brightness(0) invert(1);
      opacity: 0.94;
    }
    .cap {
      position: absolute;
      left: 0; right: 0; bottom: 52px;
      text-align: center;
      font-family: Montserrat, sans-serif;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: rgba(248, 247, 244, 0.5);
    }
    @page { size: 794px 1123px; margin: 0; }
    @media print { * { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
  </style>
</head>
<body>
  <div class="cover">
    <img src="assets/raices_logo_completo.png" alt="Raíces Developers" />
    <div class="cap">Carpeta inversores · Ceibo Vidal</div>
  </div>
</body>
</html>
